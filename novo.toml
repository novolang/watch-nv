[package]
name        = "watch-nv"
license     = "Apache-2.0"
version     = "0.1.0"
description = "Filesystem watching: an event model in which a rename is one event with two paths, include and exclude decided before a directory is watched rather than after it reports, debouncing as a value with the clock supplied, an inotify backend and a portable polling one behind one trait, and the run-on-change loop a --watch mode is."

# `license` sits immediately after the name, before any value that could
# contain a square bracket.  The publish reads it with a pattern that
# stops at the first `[`, so a description naming an effect row hides it
# and the release records no licence at all — silently.

# The first release with bodies, published over the 0.0.x interface.
# `novo pkg publish` refuses a `0.0.x` once a body is real — a
# half-built package is a 0.1.x with a smaller surface, not a 0.0.x
# with holes in it — so the version and this line are the promotion.
# `experimental` because the suites were written against the
# signatures before the bodies existed and no consumer has yet argued
# with either.  Every signature the 0.0.3 interface published is
# implemented as published; nothing was added and nothing changed.
stability   = "experimental"

# `host`, and three of the seven modules declare NOTHING: the event
# model, the filter and the debouncer are arithmetic over values the
# caller already holds — which is what lets the rename pairing, the
# ignore decision and the coalescing window all be tested in
# microseconds with no filesystem and no sleep.
#
# The rows the rest declare are NOT the `[io, time]` the plan's row
# guessed, and the difference is worth reading: the inotify backend is
# `[io]` because a watch is a file descriptor, the polling backend is
# `[fs]` because it reads directories, and `[time]` appears in exactly
# two places — the clock reading a debouncer is given, and the loop's
# own wait.  A caller that supplies both from outside pays neither.
layer       = "host"

category    = "tooling"

tags        = ["watch", "inotify", "filesystem", "debounce", "hot-reload", "notify"]
repository  = "https://github.com/novolang/watch-nv"
maintainers = ["novo-lang"]
novo        = ">= 0.20.2"

# A library: no `main`, so `novo pkg build` type-checks and
# effect-checks every module under `src/` and writes no binary.

[docs.pages]
"README.md" = "Watching a directory, and what the events mean"

[dependencies]
# The include and exclude patterns, by registry range.
#
# WHY A DEPENDENCY RATHER THAN A STRING COMPARISON.  The filter decides
# two different questions and both need a real matcher: whether an event
# is interesting, and — the one that matters — whether to DESCEND into a
# directory at all.  `glob.may_descend` is exactly the second, and it is
# the difference between twenty inotify watches and two hundred thousand
# in a repository with a build directory nobody excluded.
glob-nv = "^0.1.5"
